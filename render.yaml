services:
  - type: web
    name: docuverify-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: AI_PROVIDER
        value: openrouter
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        sync: false
      - key: OPENROUTER_VISION_MODEL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: EXTRACTION_CONCURRENCY
        value: "1"
      - key: VISION_OCR_DPI
        value: "150"
