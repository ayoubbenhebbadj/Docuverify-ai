# Render Blueprint: backend only (the frontend goes on Vercel).
services:
  - type: web
    name: docuverify-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: AI_PROVIDER
        value: openrouter
      - key: OPENROUTER_API_KEY
        sync: false            # you type it in the Render dashboard
      - key: OPENROUTER_MODEL
        sync: false
      - key: OPENROUTER_VISION_MODEL
        sync: false
      - key: CORS_ORIGINS
        sync: false            # your Vercel URL, e.g. https://docuverify.vercel.app
      - key: EXTRACTION_CONCURRENCY
        value: "1"             # free instance has 0.1 CPU / 512 MB RAM
      - key: VISION_OCR_DPI
        value: "150"
